name: Publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve agent version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "agent_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "agent_version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/antybubbs/kaya-docker-agent
          tags: |
            type=sha,format=short,prefix=sha-,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }},priority=1000
            type=ref,event=tag
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            AGENT_VERSION=${{ steps.version.outputs.agent_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
