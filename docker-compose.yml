services:
  kaya-agent:
    image: ghcr.io/antybubbs/kaya-docker-agent:latest
    container_name: kaya-docker-agent
    restart: unless-stopped
    environment:
      KAYA_URL: "https://your-kaya-url"
      # First start only: use the 15-minute, host-bound bootstrap shown by Kaya.
      # Remove this variable immediately after successful enrollment and restart.
      KAYA_AGENT_BOOTSTRAP_TOKEN: "replace-with-one-time-bootstrap"
      KAYA_AGENT_STATE_DIR: "/var/lib/kaya-agent"
      KAYA_AGENT_NAME: "docker-host-01"
      KAYA_POLL_SECONDS: "30"
      KAYA_VERIFY_TLS: "true"
      DOCKER_HOST: "unix:///var/run/docker.sock"
    volumes:
      # The Docker socket gives the agent Docker control on this host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Holds the agent-generated signing/encryption private keys. Back it up securely.
      - kaya-agent-state:/var/lib/kaya-agent
      # Only needed when Kaya backup storage type is Local path.
      # SMB storage is reached directly using the settings saved in Kaya.
      - /mnt/backups:/mnt/backups

volumes:
  kaya-agent-state:
